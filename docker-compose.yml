version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=question_pro
      - DB_PORT=3306
      - NODE_ENV=production
      - JWT_SECRET=your_super_secret_jwt_key_here
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=question_pro
    ports:
      - "3006:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
